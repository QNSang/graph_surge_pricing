# Surge policy for DEMO/REPLAY. Values are illustrative until TD-08 is approved.
policy_version: w4_pressure_revision_demo_v1
execution_mode: DEMO
replay_mode: DEMO_REPLAY
region_id: hcmc
region_label: Ho Chi Minh City (synthetic)
surge_limits:
  min: "1.00"
  max: "3.00"
  max_deviation: "0.40"
  step: "0.01"
