[project]
name = "surge-backend"
version = "0.1.0"
description = "Graph Surge Recommendation backend (DEMO/REPLAY): snapshots, recommendations, operator decisions, audit."
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "pydantic>=2.7",
  "pydantic-settings>=2.3",
  "sqlalchemy>=2.0.30",
  "alembic>=1.13",
  "psycopg[binary]>=3.2",
  "pyarrow>=16",
  "numpy>=1.26",
  "h3>=4.0",
  "pyyaml>=6",
]

[dependency-groups]
dev = ["pytest>=8", "httpx>=0.27"]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
markers = ["integration: needs PostgreSQL (TEST_DATABASE_URL)"]
