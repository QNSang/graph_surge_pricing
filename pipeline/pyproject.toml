[project]
name = "graph-surge-pipeline"
version = "0.1.0"
description = "Training pipeline for graph surge pricing (W4/H5 log-ratio residual forecast, dual-head GRU + GATv2 on H3 hex graph)"
requires-python = ">=3.10"
dependencies = [
    "torch",
    "torch-geometric",
    "numpy",
    "pandas",
    "pyarrow",
    "scipy",
    "pyyaml",
    "pydantic>=2",
    "mlflow==3.16.1",
    "matplotlib>=3.10.9",
]

[project.scripts]
surge-ml = "surge_ml.cli:main"

[dependency-groups]
dev = [
    "pytest",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/surge_ml"]

[tool.uv]
package = true

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
# Project-local tmp_path root: the shared %TEMP%\pytest-of-<user> dir can be unwritable on Windows.
addopts = "--basetemp=.pytest_tmp"
