# Dedicated 90-day V3 study. Do not modify data/CURRENT.json or old runs.
study_id: hcm-v3-flow-stgat-w4h5-001
seeds: [42, 43, 44]
variants:
  - persistence
  - gru_local37
  - gru_pointwise40
  - gru_gatv2_40
  - flow_stgatv2_self
  - flow_stgatv2_adj
  - flow_stgatv2_od
  - flow_stgatv2_full
runs_root: ../runs
data:
  source_root: ../../data/hcm_mock_v3_90d_seed42_temporal_od
  derived_root: ../../data/derived
  dataset_id: hcm_mock_v3_90d_seed42_temporal_od
  split_days: null   # manifest 90-day split: train 63 / val 13 / test 14
  std_floor: 1.0e-6
  window_steps: 4
  horizon_steps: 1
model:
  gru_hidden: 64
  neighbor_hidden: 16    # also temporal OD-edge GRU hidden size
  gat_layers: 2          # geographic adjacency channel only
  gat_heads: 4
  head_hidden: 64
  dropout: 0.1
loss:
  smooth_l1_beta: 1.0
  lambda_local: 0.3
train:
  device: auto
  batch_size: 8           # temporal edges need more memory than static graph
  eval_batch_size: 16
  epochs: 30
  lr: 1.0e-3
  weight_decay: 1.0e-4
  grad_clip_norm: 1.0
  patience: 5
  scheduler: cosine
  tie_tolerance: 1.0e-6
  smoke_batches: 2
tracking:
  enabled: false          # enable MLflow only when intentionally connected
  experiment: graph_surge_pricing_flow_v3
overrides: {}
controller:
  execution_mode: demo
  policy_version: w4_pressure_revision_demo_v1
  reference_version: smoothed_q_reference_demo_v1
  calibrated: false
  reference_q: 1.2
  q_min: 1.0e-6
  pressure_dead_zone: 0.10
  revision_dead_zone: 0.05
  pressure_gain: 0.60
  revision_gain: 0.40
  max_requested_delta: 0.40
  surge_min: 1.0
  surge_max: 3.0
