# Horizon study: W=6 (30 min window), horizon 15 min. Same derived cache as train.yaml; y = b shifted 3 step(s).
# Column routing and split rules live in src/surge_ml/features.py; window/horizon are set under data.
study_id: hcm-v12-w6-h15-001
seeds: [42, 43, 44]
variants: [persistence, gru_local37, gru_pointwise40, gru_gatv2_40, gru_gatv2_40_no_od, gru_gatv2_40_no_adj]
runs_root: ../runs

data:
  current: ../../data/CURRENT.json  # release pointer; gives the dataset path (or set source_root instead)
  derived_root: ../../data/derived
  dataset_id: hcm_mock_v2_90d_seed42_bounded_tail  # must match CURRENT.json; bump study_id when it changes
  split_days: null  # null = manifest suggested_split_days_inclusive (90 days: train 1-63, val 64-76, test 77-90)
  std_floor: 1.0e-6
  window_steps: 6  # t-25 .. t
  horizon_steps: 3  # 15 min

model:
  gru_hidden: 64
  neighbor_hidden: 16
  gat_layers: 2
  gat_heads: 4
  head_hidden: 64
  dropout: 0.1

loss:
  smooth_l1_beta: 1.0
  lambda_local: 0.3

train:
  device: auto
  batch_size: 32
  eval_batch_size: 128
  epochs: 30
  lr: 1.0e-3
  weight_decay: 1.0e-4
  grad_clip_norm: 1.0
  patience: 5
  scheduler: cosine
  tie_tolerance: 1.0e-6
  smoke_batches: 5

# LightGBM comparators (lgbm37, lgbm40). Objective regression_l2 is fixed in models/lgbm.py.
lgbm:
  learning_rate: 0.05
  num_leaves: 63
  min_child_samples: 50
  subsample: 0.8
  colsample_bytree: 0.8
  n_estimators: 1000
  early_stopping: 30
  smoke_estimators: 20

# Per-variant tuning, merged over the shared model/loss/train/lgbm sections above. Only the overridden
# variant's trials become stale. Find values with `surge-ml sweep`, e.g.:
#   surge-ml sweep --variant gru_gatv2_40 --grid model.gru_hidden=32,64,96 --grid train.lr=1e-3,5e-4
overrides: {}
#  gru_gatv2_40: {model: {gru_hidden: 96}, train: {lr: 5.0e-4}}
#  lgbm40: {lgbm: {num_leaves: 127}}

tracking:
  enabled: true
  experiment: graph_surge_pricing_w6_h15  # prefix; each run appends _<YYYYmmdd-HHMMSS>

# Demo/shadow-only policy values from technical_report.md §11. They are not calibrated
# and are deliberately rejected as production-ready by the config model.
controller:
  execution_mode: demo
  policy_version: w4_pressure_revision_demo_v1
  reference_version: smoothed_q_reference_demo_v1
  calibrated: false
  reference_q: 1.2
  q_min: 1.0e-6
  pressure_dead_zone: 0.10
  revision_dead_zone: 0.05
  pressure_gain: 0.60
  revision_gain: 0.40
  max_requested_delta: 0.40
  surge_min: 1.0
  surge_max: 3.0
