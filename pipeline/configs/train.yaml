# CPU study on a 20-day slice of the V3 90-day dataset (days 36-55). Do not modify data/CURRENT.json or old runs.
# Train 36-49 = two full weeks (venue 36/37/42, rain 40/46); val 50-52 (Mon-Wed); test 53-55 (venue 53, rain 54, Sat 55).
# Days before 36 stay available as history (60-min windows, seasonal_naive y[k-288]).
study_id: hcm-v3-cpu-20d-w4h5-002  # 002: scaler fit on train days 36-49 only (001 fit on days 1-49)
seeds: [42, 43, 44]
variants: [persistence, seasonal_naive, gru_gatv2_40]
runs_root: ../runs

data:
  source_root: ../../data/hcm_mock_v3_90d_seed42_temporal_od
  derived_root: ../../data/derived
  dataset_id: hcm_mock_v3_90d_seed42_temporal_od
  split_days:
    train: [36, 49]
    val: [50, 52]
    test: [53, 55]
  std_floor: 1.0e-6
  window_steps: 4
  horizon_steps: 1

model:
  gru_hidden: 64
  neighbor_hidden: 16
  gat_layers: 2
  gat_heads: 4
  head_hidden: 64
  dropout: 0.1

loss:
  smooth_l1_beta: 1.0
  lambda_local: 0.3

train:
  device: cpu
  batch_size: 32
  eval_batch_size: 128
  epochs: 30
  lr: 1.0e-3
  weight_decay: 1.0e-4
  grad_clip_norm: 1.0
  patience: 5
  scheduler: cosine
  tie_tolerance: 1.0e-6
  smoke_batches: 5
