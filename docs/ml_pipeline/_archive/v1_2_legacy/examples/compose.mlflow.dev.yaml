# Specification template: localhost, one user / one active trial.
# From repository root after copying to pipeline/infra:
# docker compose -f pipeline/infra/compose.mlflow.dev.yaml up -d
name: surge-mlflow-dev
services:
  mlflow:
    image: ghcr.io/mlflow/mlflow:v3.16.1
    restart: unless-stopped
    init: true
    ports:
      - "127.0.0.1:5000:5000"
    command:
      - mlflow
      - server
      - --host
      - 0.0.0.0
      - --port
      - "5000"
      - --backend-store-uri
      - sqlite:////mlflow/db/mlflow.db
      - --serve-artifacts
      - --artifacts-destination
      - /mlflow/artifacts
      - --allowed-hosts
      - "127.0.0.1:*,localhost:*,mlflow:*"
    volumes:
      - mlflow_db:/mlflow/db
      - mlflow_artifacts:/mlflow/artifacts
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:5000/health',timeout=5).read()"
      interval: 15s
      timeout: 6s
      retries: 5
      start_period: 30s
volumes:
  mlflow_db:
  mlflow_artifacts:
