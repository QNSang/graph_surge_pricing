# Specification template: run on the tracking host; client access by approved tunnel/gateway.
# Requires exact approved POSTGRES_IMAGE and PSYCOPG2_VERSION, plus a generated hex DB password.
# Do not run concurrently with the development profile on the same host port5000.
name: surge-mlflow-team
services:
  postgres:
    image: ${POSTGRES_IMAGE:?Set an exact approved PostgreSQL image tag or digest}
    restart: unless-stopped
    environment:
      POSTGRES_USER: mlflow
      POSTGRES_DB: mlflow
      POSTGRES_PASSWORD: ${MLFLOW_DB_PASSWORD:?Set a generated hex password outside Git}
      PGDATA: /var/lib/postgresql/data/pgdata
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: [CMD-SHELL, "pg_isready -U mlflow -d mlflow"]
      interval: 10s
      timeout: 5s
      retries: 5
  mlflow:
    build:
      context: .
      dockerfile: Dockerfile.mlflow
      args:
        MLFLOW_VERSION: "3.16.1"
        PSYCOPG2_VERSION: ${PSYCOPG2_VERSION:?Set the exact tested database driver version}
    image: surge-mlflow-server:3.16.1
    restart: unless-stopped
    init: true
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "127.0.0.1:5000:5000"
    environment:
      MLFLOW_BACKEND_STORE_URI: postgresql+psycopg2://mlflow:${MLFLOW_DB_PASSWORD:?Set a generated hex password outside Git}@postgres:5432/mlflow
    command:
      - mlflow
      - server
      - --host
      - 0.0.0.0
      - --port
      - "5000"
      - --serve-artifacts
      - --artifacts-destination
      - /mlflow/artifacts
      - --allowed-hosts
      - "127.0.0.1:*,localhost:*,mlflow:*"
    volumes:
      - mlflow_artifacts:/mlflow/artifacts
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:5000/health',timeout=5).read()"
      interval: 15s
      timeout: 6s
      retries: 5
      start_period: 30s
volumes:
  postgres_data:
  mlflow_artifacts:
